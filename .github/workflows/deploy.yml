# ============================================================
# Publica o quiz no GitHub Pages a cada envio para a main.
# O site é estático: não tem build, o Actions só empacota a
# pasta e entrega para o Pages.
# ============================================================
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite publicar na mão, pelo site do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se houver duas, a mais nova espera a atual terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
